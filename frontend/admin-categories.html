
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | CAFINITY</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2 class="logo">CAFINITY<span>.</span></h2>
        <a href="admin.html" class="nav-link">Dashboard</a>
    </nav>

    <section class="cart-header">
        <h1>Manage Categories</h1>
        <p>Add, edit and manage food categories.</p>
    </section>

    <section class="checkout-container">

        <div class="checkout-card">
            <h2 id="formTitle">Add New Category</h2>

            <form id="categoryForm">
                <input type="hidden" id="categoryID">

                <label>Category Name</label>
                <input type="text" id="categoryName" required>

                <button type="submit" class="btn full-btn" id="saveBtn">
                    Add Category
                </button>

                <button type="button" id="cancelBtn" class="btn full-btn">
                    Cancel Edit
                </button>
            </form>

            <p id="message"></p>
        </div>

        <div class="checkout-card">
            <h2>Existing Categories</h2>
            <div id="categoryList">Loading...</div>
        </div>

    </section>

    <script src="js/admin-categories.js"></script>
</body>
</html>
